name: FIPS Build

# Builds a FIPS-clean opencv-python / opencv-python-headless / opencv-contrib-python
# for ModelAgent (voicdgroupinc/ModelAgent). Unlike upstream's build_wheels_manylinux.yml,
# this:
#   - targets only x86_64 / manylinux_2_28 / Python 3.12 (ModelAgent's actual runtime,
#     not the full upstream compatibility matrix)
#   - passes CMAKE_ARGS=-DOPENCV_FFMPEG_SKIP_DOWNLOAD=ON so the build does not fetch
#     OpenCV's prebuilt ffmpeg plugin, which bundles OpenSSL 1.1.1k -- the FIPS
#     self-test in that vendored copy is what crashes ModelAgent on FIPS-enabled
#     clusters (crypto/fips/fips.c:154: FATAL FIPS SELFTEST FAILURE). This also means
#     these wheels have no FFmpeg-backed cv2.VideoCapture() support -- known tradeoff,
#     see ModelAgent's documentation/notes_and_reference_info/FIPS_Issue_Investigations.md
#   - publishes wheels as GitHub Release assets on this repo instead of to PyPI (no
#     PyPI credentials for this fork, and these packages should never be published
#     to the real opencv-python/opencv-contrib-python/opencv-python-headless PyPI
#     projects -- that would collide with upstream's own releases)
#   - builds all three of opencv-python, opencv-python-headless and opencv-contrib-python
#     from the same fixed config, so whichever one "wins" the site-packages install
#     race (see FIPS_Issue_Investigations.md) no longer matters -- none of them carry
#     a vendored OpenSSL

on:
  workflow_dispatch:
  push:
    tags:
      - 'fips-v*'

jobs:
  Build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - with_contrib: 0
            without_gui: 0
            name: opencv-python
          - with_contrib: 0
            without_gui: 1
            name: opencv-python-headless
          - with_contrib: 1
            without_gui: 0
            name: opencv-contrib-python

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      REPO_DIR: .
      PROJECT_SPEC: opencv-python
      MB_PYTHON_VERSION: '3.12'
      TRAVIS_PYTHON_VERSION: '3.12'
      MB_ML_VER: 2_28
      TRAVIS_BUILD_DIR: ${{ github.workspace }}
      CONFIG_PATH: travis_config.sh
      DOCKER_IMAGE: quay.io/opencv-ci/opencv-python-manylinux_2_28-x86-64:20260725
      USE_CCACHE: 0
      UNICODE_WIDTH: 32
      PLAT: x86_64
      SDIST: 0
      ENABLE_HEADLESS: ${{ matrix.without_gui }}
      ENABLE_CONTRIB: ${{ matrix.with_contrib }}
      # See header comment: this is the actual FIPS fix. Consumed automatically by
      # scikit-build (setup.py's build backend here), which appends the CMAKE_ARGS
      # env var's contents to its own cmake invocation -- same mechanism already
      # confirmed working in ModelAgent's own (reverted) in-place build attempt,
      # where FFMPEG correctly came up disabled with no error from this flag.
      CMAKE_ARGS: -DOPENCV_FFMPEG_SKIP_DOWNLOAD=ON

    steps:
    - name: Cleanup
      run: find . -mindepth 1 -delete
      working-directory: ${{ github.workspace }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 0

    - name: Build a package
      run: source scripts/build.sh

    - name: Saving a wheel for ${{ matrix.name }}
      uses: actions/upload-artifact@v7
      with:
        name: wheel-${{ matrix.name }}
        path: wheelhouse/opencv*.whl

  Test:
    needs: [Build]
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - with_contrib: 0
            without_gui: 0
            name: opencv-python
          - with_contrib: 0
            without_gui: 1
            name: opencv-python-headless
          - with_contrib: 1
            without_gui: 0
            name: opencv-contrib-python

    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      MB_PYTHON_VERSION: '3.12'
      NP_TEST_DEP: numpy==2.2.6
      CONFIG_PATH: travis_config.sh
      PLAT: x86_64
      SDIST: 0
      ENABLE_HEADLESS: ${{ matrix.without_gui }}
      ENABLE_CONTRIB: ${{ matrix.with_contrib }}

    steps:
    - name: Cleanup
      run: find . -mindepth 1 -delete
      working-directory: ${{ github.workspace }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup Environment variables
      run: echo "TEST_DEPENDS=$(echo $NP_TEST_DEP)" >> $GITHUB_ENV

    - name: Download wheel for ${{ matrix.name }}
      uses: actions/download-artifact@v8
      with:
        name: wheel-${{ matrix.name }}
        path: wheelhouse/

    - name: Package installation and run tests
      run: source scripts/install.sh

    # cv2 import must succeed with no FFmpeg backend, matching the FIPS build's
    # intentional tradeoff -- but must NOT crash, and must NOT pull in a vendored
    # OpenSSL. Fails loudly here instead of silently in ModelAgent's own build.
    - name: Verify no vendored OpenSSL / FIPS crash string in the built wheel
      run: |
        set -e
        WHL=$(ls wheelhouse/opencv*.whl | head -1)
        mkdir -p /tmp/whl-check
        cd /tmp/whl-check
        unzip -q "$OLDPWD/$WHL"
        if grep -rl "crypto/fips/fips.c\|FATAL FIPS SELFTEST FAILURE" . 2>/dev/null; then
          echo "FAIL: built wheel still bundles the vendored OpenSSL that crashes under FIPS"
          exit 1
        fi
        if find . -iname "libcrypto*" -o -iname "libssl*" | grep -q .; then
          echo "FAIL: built wheel bundles a libssl/libcrypto of its own"
          find . -iname "libcrypto*" -o -iname "libssl*"
          exit 1
        fi
        echo "OK: no vendored OpenSSL/libcrypto in $WHL"

  Release:
    if: startsWith(github.ref, 'refs/tags/fips-v')
    needs: [Build, Test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheelhouse/

      - name: Publish wheels as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/wheel-*/opencv*.whl
          generate_release_notes: true
          body: |
            FIPS-clean build for ModelAgent (voicdgroupinc/ModelAgent). OpenCV
            pinned to 4.12.0 (avoids the AVX512-VNNI DNN dispatch code introduced
            in 5.0.0, which fails to assemble on ModelAgent's build toolchain).
            Built with CMAKE_ARGS=-DOPENCV_FFMPEG_SKIP_DOWNLOAD=ON: no FFmpeg
            backend in cv2, so no vendored OpenSSL 1.1.1k either -- these wheels
            do not carry the FIPS self-test crash. cv2.VideoCapture() will not
            work with these builds; see FIPS_Issue_Investigations.md in
            ModelAgent for the known-affected call site and fallback plan.

name: FIPS Build

# FIPS-clean opencv-python / opencv-python-headless / opencv-contrib-python for
# ModelAgent (voicdgroupinc/ModelAgent), WITH FFmpeg video decoding.
#
# Since fips-v4.12.0-4 these are not source builds. fips/build_fips_wheels.sh takes
# the upstream PyPI 4.12.0.88 wheels (sha256-pinned), rebuilds only their libavformat
# from FFmpeg 5.1.6 without OpenSSL (inside quay.io/pypa/manylinux2014_x86_64, glibc
# 2.17), swaps it in, deletes the bundled libssl/libcrypto 1.1.1 and relaxes the numpy
# pin to numpy>=2 as the earlier fips releases did. Everything else (cv2, libavcodec,
# libswscale, libavutil) stays the upstream binary, so frames decode exactly as with
# the PyPI wheels; cv2.VideoCapture works on files again. Only https/tls/rtmps inputs
# are gone, because they were what needed OpenSSL.
#
# Up to fips-v4.12.0-3 this workflow built OpenCV 4.12.0 from source with
# -DWITH_FFMPEG=OFF (no vendored OpenSSL, but no cv2.VideoCapture either; see
# ModelAgent's documentation/notes_and_reference_info/FIPS_Issue_Investigations.md).
#
# Wheels are published as GitHub Release assets on this repo, never to PyPI (they
# would collide with upstream's own projects).

on:
  workflow_dispatch:
  push:
    tags:
      - 'fips-v*'

jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build the three wheels
      run: bash fips/build_fips_wheels.sh wheelhouse

    - name: Save wheels
      uses: actions/upload-artifact@v7
      with:
        name: fips-wheels
        path: |
          wheelhouse/opencv*.whl
          wheelhouse/SHA256SUMS
          wheelhouse/ffmpeg-*

  Test:
    needs: [Build]
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download wheels
      uses: actions/download-artifact@v8
      with:
        name: fips-wheels
        path: wheelhouse/

    # In ModelAgent's base image, all three installed together with numpy 2.x:
    # no libssl/libcrypto or OpenSSL 1.1.1 code anywhere in the wheels, import
    # works, FFMPEG: YES, and VideoWriter/VideoCapture round trips read back.
    - name: Check the wheels
      run: bash fips/check_wheels.sh wheelhouse

  Release:
    if: startsWith(github.ref, 'refs/tags/fips-v')
    needs: [Build, Test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fips-wheels
          path: wheelhouse/

      - name: Publish wheels as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wheelhouse/opencv*.whl
            wheelhouse/SHA256SUMS
          body: |
            FIPS-clean OpenCV 4.12 for ModelAgent (voicdgroupinc/ModelAgent), with
            video decoding.

            The upstream PyPI 4.12.0.88 wheels of opencv-python,
            opencv-python-headless and opencv-contrib-python, with libavformat
            rebuilt from FFmpeg 5.1.6 without OpenSSL and the bundled
            libssl/libcrypto 1.1.1 removed (fips/build_fips_wheels.sh). No
            library in these wheels links or carries OpenSSL.

            - cv2.VideoCapture reads video files again (FFMPEG: YES); frames
              decode identically to the PyPI wheels.
            - https://, tls:// and rtmps:// inputs no longer open.
            - Version 4.12.0.88+fips4; numpy>=2 (the PyPI pin numpy<2.3 is
              relaxed, as in earlier fips releases).
            - Install all three together, as ModelAgent does.
